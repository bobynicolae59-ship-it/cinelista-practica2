<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Añadir Título - CineLista</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/css-anadirTitulo.css}">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/mi-lista}">CineLista</a>
        <div class="navbar-nav">
            <a class="nav-link" th:href="@{/mi-lista}">Mi Lista</a>
            <a class="nav-link active" th:href="@{/anadir-titulo}">Añadir título</a>
        </div>
    </div>
</nav>

<main class="container my-4" style="max-width: 600px;">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h2 class="h5 mb-0">Añadir nuevo título</h2>
        </div>
        <div class="card-body">
            <form th:action="@{/guardar}" th:object="${pelicula}" method="post">
                <div class="mb-3">
                    <label for="titulo" class="form-label">Título</label>
                    <input type="text" class="form-control" id="titulo" th:field="*{titulo}" required placeholder="Ej. Interstellar">
                </div>
                <div class="mb-3">
                    <label for="genero" class="form-label">Género</label>
                    <input type="text" class="form-control" id="genero" th:field="*{genero}" required placeholder="Ej. Ciencia Ficcion">
                </div>
                <div class="mb-3">
                    <label for="plataforma" class="form-label">Plataforma</label>
                    <input type="text" class="form-control" id="plataforma" th:field="*{plataforma}" required placeholder="Ej. Hbo Max">
                </div>
                <div class="mb-3">
                    <label for="estado" class="form-label">Estado</label>
                    <select class="form-select" id="estado" th:field="*{estado}" required>
                        <option value="Vista">Vista</option>
                        <option value="No vista">No vista</option>
                        <option value="Pendiente">Pendiente</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="valoracion" class="form-label">Valoración</label>
                    <input type="text" class="form-control" id="valoracion" th:field="*{valoracion}" placeholder="Ej. 5 estrellas o -">
                </div>
                <div class="d-flex justify-content-between mt-4">
                    <a th:href="@{/mi-lista}" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-success" id="btn-guardar">Guardar</button>
                </div>
            </form>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
