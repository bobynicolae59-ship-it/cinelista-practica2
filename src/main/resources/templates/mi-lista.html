<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mi Lista - CineLista</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/css-ejer4,5,6y7.css}">
</head>
<body class="bg-light">

<!-- Barra de navegación -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/mi-lista}">CineLista</a>
        <div class="navbar-nav">
            <a class="nav-link active" th:href="@{/mi-lista}">Mi Lista</a>
            <a class="nav-link" th:href="@{/anadir-titulo}">Añadir título</a>
        </div>
    </div>
</nav>

<main class="container" id="contenedor-principal">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 id="titulo-pagina" class="h2">Mi Lista</h1>
        <a th:href="@{/anadir-titulo}" class="btn btn-primary" id="btn-anadir">Añadir</a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-bordered table-striped table-hover mb-0 text-center align-middle">
                <thead class="table-light">
                <tr>
                    <th>Titulo</th>
                    <th>Género</th>
                    <th>Plataforma</th>
                    <th>Estado</th>
                    <th>Valoración</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(peliculas)}">
                    <td colspan="6" class="text-center py-3">No hay películas en la lista.</td>
                </tr>
                <tr th:each="peli : ${peliculas}">
                    <td th:text="${peli.titulo}">Interstellar</td>
                    <td th:text="${peli.genero}">Ciencia Ficcion</td>
                    <td th:text="${peli.plataforma}">Hbo Max</td>
                    <td th:text="${peli.estado}">Vista</td>
                    <td th:text="${peli.valoracion}">5 estrellas</td>
                    <td>
                        <a th:href="@{/eliminar/{id}(id=${peli.id})}"
                           class="btn btn-danger btn-sm"
                           onclick="return confirm('¿Deseas eliminar este título?');">
                            Eliminar
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
