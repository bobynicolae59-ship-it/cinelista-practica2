<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <!-- Recursos comunes a TODAS las paginas: CSS de Bootstrap + estilo propio -->
    <th:block th:fragment="comunes">
        <meta charset="UTF-8">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <link rel="stylesheet" th:href="@{/css/estilo.css}">
    </th:block>

    <!-- Solo para estadisticas.html -->
    <th:block th:fragment="datatables">
        <link rel="stylesheet" href="https://cdn.datatables.net/1.13.11/css/jquery.dataTables.min.css">
        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
        <script src="https://cdn.datatables.net/1.13.11/js/jquery.dataTables.min.js"></script>
    </th:block>

    <!-- Extension Buttons de DataTables (exportar a CSV), solo para estadisticas.html -->
    <th:block th:fragment="datatables-buttons">
        <link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.4.3/css/buttons.dataTables.min.css">
        <script src="https://cdn.datatables.net/buttons/2.4.3/js/dataTables.buttons.min.js"></script>
        <script src="https://cdn.datatables.net/buttons/2.4.3/js/buttons.html5.min.js"></script>
    </th:block>

    <!-- Solo para estrenos.html -->
    <th:block th:fragment="react">
        <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
        <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
        <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    </th:block>

</head>
<body></body>
</html>
